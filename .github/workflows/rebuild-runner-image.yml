name: Rebuild Runner Image

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/arc-runner

permissions:
  contents: write
  packages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check upstream runner version
        id: version
        run: |
          docker pull ghcr.io/actions/actions-runner:latest -q
          LATEST=$(docker run --rm ghcr.io/actions/actions-runner:latest \
            /home/runner/bin/Runner.Listener --version 2>&1 \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$')
          CURRENT=$(tr -d '[:space:]' < .runner-version)

          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          if [[ "$LATEST" != "$CURRENT" ]]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report when runner version is unchanged
        if: steps.version.outputs.update == 'false' && github.event_name != 'workflow_dispatch'
        run: echo "Runner version is still ${{ steps.version.outputs.current }}; rebuilding to refresh OS packages."

      - name: Update pinned version
        if: steps.version.outputs.update == 'true'
        run: echo "${{ steps.version.outputs.latest }}" > .runner-version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runner image
        run: |
          VERSION=$(tr -d '[:space:]' < .runner-version)
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --pull \
            --build-arg "RUNNER_VERSION=$VERSION" \
            -t "$REGISTRY/$IMAGE_NAME:$VERSION" \
            -t "$REGISTRY/$IMAGE_NAME:latest" \
            --push \
            .

      - name: Commit version bump
        if: steps.version.outputs.update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .runner-version
          git commit -m "chore: bump runner version to $(tr -d '[:space:]' < .runner-version)"
          git push
